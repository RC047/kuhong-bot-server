<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" name="og:image" content="https://i.ibb.co/frhZmyZ/pp.jpg">
    <meta property="og:description" content="Simple Web Bot">
    <title>Chat Bot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.5/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <style>
body {
	margin-bottom: 1.5rem;
	-moz-user-select: none;
    cursor: default;
}

input[type=number] {
    -moz-appearance: textfield;
}

input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

.card {
    margin-top: 2rem; 
    height: 90vh;
}

.card-header {
	background: rgb(0, 157, 255);
	color: white;
}

.card-header img {
    margin-right: 1rem;
    height: 2rem;
}

.other-menu-btn {
    background-color: rgb(0, 157, 255);
    color: white;
    padding: 12.5px;
    font-size: 17.5px;
    border: none;
    cursor: pointer;
}

.other-menu-btn:hover, .other-menu-btn:focus {
    background-color: rgb(0, 143, 241);
}

.other-menu {
    position: relative;
    left: 45%;
    top: 5%;
    display: inline-block;
}

.other-menu-content {
    display: none;
    position: absolute;
    right: 25%;
    background-color: rgb(255, 255, 255);
    min-width: 160px;
    overflow: auto;
    box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
    z-index: 1;
}

.other-menu-content a {
    color: black;
    padding: 10px 15px;
    text-decoration: none;
    display: block;
}

.other-menu a:hover {
	background-color: rgb(241, 241, 241);
}

.card-body {
	background: rgba(52, 58, 64, 255);
	padding: 0;
    padding-top: 1rem;
}

.contact-profile {
    width: 100%;
    height: 5rem;
    background: black;
    color: white
}

.contact-profile img {
    width: 4rem;
    border-radius: 50%;
    float: left;
    margin: 0.75rem 1.25rem 0 0.75rem;
}

.contact-profile p {
    float: left;
}

.messages {
    height: auto;
    min-height: 100%;
    max-height: 50vh;
    overflow-y: scroll;
    overflow-x: hidden;
}

.messages::-webkit-scrollbar {
    width: 8px;
    background: transparent;
}

.messages::-webkit-scrollbar-thumb {
    background-color: rgba(0, 0, 0, 0.3);
}

.messages ul li {
    display: inline-block;
    clear: both;
    width: calc(100% - 1rem);
    font-size: 0.75rem;
}

.messages ul li:nth-last-child(1) {
    margin-bottom: 1.5rem;
}

.messages ul li.you {
	position: relative;
	left: 1rem;
}

.messages ul li.you img {
    float: right;
    margin: 0.6rem 0 0 0.75rem;
}

.messages ul li.you p {
    background: rgb(0, 157, 255);
    color: white;
    float: right;
}

.messages ul li.bot {
	position: relative;
	right: 2rem;
}

.messages ul li.bot img {
	float: left;
    margin: 0.6rem 0.75rem 0 0;
}

.messages ul li.bot p {
    background: rgb(255, 255, 255);
    color: black;
    float: left;
}

.messages ul li img {
    width: 2rem;
    border-radius: 50%;
    float: left;
}

.messages ul li p {
    display: inline-block;
    padding: 1rem 1.5rem;
    border-radius: 2rem;
    max-width: 80%;
    line-height: 130%;
}

.btn-outline-dark {
	background-color: rgb(0, 157, 255);
}

.fa-paper-plane, .fa-paperclip {
	color: white;
}

.monospace {
	font-family: monospace;
    font-style: normal;
    font-variant: normal;
}

.show {
	display: block;
}
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;">
    <div class="container mx-auto center">
        <div class="card bg-light">
            <div class="card-header">
                <img src="https://i.ibb.co/frhZmyZ/pp.jpg"></img>
                <b>Kuhong Bot</b>
                <div class="other-menu">
                    <div class="other-menu-btn" href="javascript:void(0);"><i class="fa-solid fa-ellipsis-vertical"></i></div>
                    <div class="other-menu-content">
                        <a class="change-name" href="javascript:void(0);">Change Name</a>
                        <a class="clear-chat" href="javascript:void(0);">Clear Chat</a>
                        <a class="owner" href="https://wa.me/62895337278647">Owner</a>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="messages"><ul></ul></div>
            </div>
            <div class="card-footer">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Ketik pesan" dir="auto">
                    <div class="input-group-append">
                        <button class="btn btn-outline-dark send"><i class="fa fa-paper-plane"></i></button>
                        <button class="btn btn-outline-dark sen-file"><i class="fa fa-paperclip attachment"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./web_bot.js"></script>
</body>
</html>
